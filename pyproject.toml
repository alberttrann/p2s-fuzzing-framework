[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p2s-framework"
version = "1.2.0"
description = "Execution-verified API security testing and dataset generation SDK"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "P2S Framework Contributors"}]
keywords = ["api-security", "fuzzing", "openapi", "llm", "dataset-generation", "security-testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.23",
  "openai>=1.0",
  "psycopg2-binary>=2.9",
  "pyyaml>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
transformers = [
  "torch>=2.1",
  "transformers>=4.40",
  "safetensors>=0.4",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "twine>=5.0",
]

[project.scripts]
p2s = "p2s.cli:main"

[tool.setuptools.packages.find]
include = ["p2s", "p2s.*"]

[tool.setuptools.package-data]
p2s = ["py.typed"]
