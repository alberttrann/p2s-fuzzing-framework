# Framework-native Track-B config for pet-clinic.
# RESTgym keeps its historical semantically-active mitmproxy on host :9090.
# The retained workload fixture emits P2S primitive-trace JSONL; `p2s record`
# freezes that trace, then the shared v1.2 compiler/fuzzer/reset lifecycle is used.
[target]
name = "pet_clinic"
base_url = "http://localhost:9090/petclinic"
openapi_spec = "p2s_specs/petclinic.json"
state_adapter = "command"
executor_adapter = "ocli"
context_path_prefix = ""
golden_out = "pet_clinic_p2s_golden_dataset.jsonl"
silver_out = "pet_clinic_p2s_silver_dataset.jsonl"
checkpoint_file = "pet_clinic_p2s_processed_flows.txt"

[command_state]
working_directory = "."
restore_sleep_seconds = 2.0
restore_snapshot_command = '''docker restart restgym_petclinic >/dev/null'''

[llm]
backend = "openai_compat"
base_url = "http://localhost:8081/v1"
model = "qwen35-9b-p2s"
api_key = "no-key"
max_attempts = 6

[ocli]
profile_name = "p2s12_pet_clinic"
api_base_url = "http://localhost:9090/petclinic"
openapi_spec = "p2s_specs/petclinic.json"
basic_auth = "admin:admin"
command_prefix = ""
throttle_delay_seconds = 0.015
timeout_seconds = 150

# Optional diagnostic P2S proxy. It is NOT used by the retained Track-B workload;
# starting it on 9190 preserves RESTgym mitmproxy at the historical host :9090.
[proxy]
listen_port = 9190
target_host = "http://localhost:9090"
flow_strategy = "header"
output_file = "primitive_traces.jsonl"

[research]
root_dir = "$RESTGYM_ROOT"
prepare_commands = [
  "docker rm -f restgym_petclinic 2>/dev/null || true",
  "docker build -t restgym/petclinic:latest -f apis/pet-clinic/Dockerfile .",
  "MSYS_NO_PATHCONV=1 docker run -d --name restgym_petclinic -p 9090:9090 -p 12345:12345 -e API=pet-clinic -e TOOL=manual -e RUN=1 restgym/petclinic:latest",
  "sleep 15",
  "mkdir -p p2s_specs",
  "MSYS_NO_PATHCONV=1 docker exec restgym_petclinic bash -c 'curl -s -u admin:admin http://localhost:8080/petclinic/v3/api-docs -o /tmp/petclinic.json || curl -s -u admin:admin http://localhost:8080/petclinic/v2/api-docs -o /tmp/petclinic.json'",
  "MSYS_NO_PATHCONV=1 docker cp restgym_petclinic:/tmp/petclinic.json p2s_specs/petclinic.json"
]
record_command = "python record_petclinic_full_35.py"
record_trace_source = "p2s_traces/pet-clinic/primitive_traces.jsonl"
record_snapshot_file = "baseline_primitive_traces.jsonl"
time_budget_seconds = 3600
cyclic = true
clear_checkpoint_for_cyclic = true
reset_before_each_target = true
pre_step_replay = "none"
require_attack_flag_for_2xx = true
patch_openapi_required = true
runtime_openapi_file = "pet_clinic_runtime_relaxed.json"
cleanup_commands = ["docker rm -f restgym_petclinic 2>/dev/null || true"]

[[patches]]
kind = "write"
path = "apis/pet-clinic/restgym-api-config.yml"
content = "enabled: true\n"
