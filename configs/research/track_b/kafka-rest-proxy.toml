# Framework-native Track-B config for kafka-rest-proxy.
# RESTgym keeps its historical semantically-active mitmproxy on host :9090.
# The retained workload fixture emits P2S primitive-trace JSONL; `p2s record`
# freezes that trace, then the shared v1.2 compiler/fuzzer/reset lifecycle is used.
[target]
name = "kafka_rest_proxy"
base_url = "http://localhost:9090"
openapi_spec = "$P2S_KAFKA_SPEC"
state_adapter = "command"
executor_adapter = "ocli"
context_path_prefix = ""
golden_out = "kafka_rest_proxy_p2s_golden_dataset.jsonl"
silver_out = "kafka_rest_proxy_p2s_silver_dataset.jsonl"
checkpoint_file = "kafka_rest_proxy_p2s_processed_flows.txt"

[command_state]
working_directory = "."
restore_sleep_seconds = 2.0
restore_snapshot_command = '''docker exec restgym_kafkarest kafka-topics --bootstrap-server localhost:9092 --delete --topic p2s-topic >/dev/null 2>&1 || true'''

[llm]
backend = "openai_compat"
base_url = "http://localhost:8081/v1"
model = "qwen35-9b-p2s"
api_key = "no-key"
max_attempts = 6

[ocli]
profile_name = "p2s12_kafka_rest_proxy"
api_base_url = "http://localhost:9090"
openapi_spec = "$P2S_KAFKA_SPEC"
command_prefix = ""
throttle_delay_seconds = 0.015
timeout_seconds = 150

# Optional diagnostic P2S proxy. It is NOT used by the retained Track-B workload;
# starting it on 9190 preserves RESTgym mitmproxy at the historical host :9090.
[proxy]
listen_port = 9190
target_host = "http://localhost:9090"
flow_strategy = "header"
output_file = "primitive_traces.jsonl"

[research]
root_dir = "$RESTGYM_ROOT"
prepare_commands = [
  "docker rm -f restgym_kafkarest 2>/dev/null || true",
  "docker build -t restgym/kafkarest:latest -f apis/kafka-rest-proxy/Dockerfile .",
  "MSYS_NO_PATHCONV=1 docker run -d --name restgym_kafkarest -p 9090:9090 -p 12345:12345 -e API=kafka-rest-proxy -e TOOL=manual -e RUN=1 restgym/kafkarest:latest",
  "sleep 30"
]
record_command = "python record_kafkarest_full_50.py"
record_trace_source = "p2s_traces/kafka-rest-proxy/primitive_traces.jsonl"
record_snapshot_file = "baseline_primitive_traces.jsonl"
time_budget_seconds = 3600
cyclic = true
clear_checkpoint_for_cyclic = true
reset_before_each_target = true
pre_step_replay = "none"
require_attack_flag_for_2xx = true
patch_openapi_required = true
runtime_openapi_file = "kafka_rest_proxy_runtime_relaxed.json"
cleanup_commands = ["docker rm -f restgym_kafkarest 2>/dev/null || true"]
